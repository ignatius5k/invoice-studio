<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Studio — Six Redesign Drafts</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #eef1f4;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 1720px; margin: 0 auto; padding: 42px; }
      header { margin-bottom: 28px; }
      h1 { margin: 0 0 8px; font-size: 36px; letter-spacing: -0.03em; }
      header p { margin: 0; color: #526071; font-size: 18px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
      figure {
        margin: 0;
        overflow: hidden;
        background: white;
        border: 1px solid #d8dee7;
        border-radius: 14px;
        box-shadow: 0 16px 38px rgba(22, 34, 51, 0.08);
      }
      img { display: block; width: 100%; height: auto; }
      figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        min-height: 76px;
        padding: 18px 20px;
        border-top: 1px solid #e3e7ed;
      }
      strong { font-size: 20px; }
      span { color: #667085; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Invoice Studio redesign drafts</h1>
        <p>Six full interface directions covering desktop, mobile, invoice preview, and loading motion.</p>
      </header>
      <section class="grid">
        <figure>
          <img src="01-tropical-civic.png" alt="Draft 1, Tropical Civic" />
          <figcaption><strong>1. Tropical Civic</strong><span>Jade, clay, limestone</span></figcaption>
        </figure>
        <figure>
          <img src="02-swiss-ledger.png" alt="Draft 2, Swiss Ledger" />
          <figcaption><strong>2. Swiss Ledger</strong><span>Ultramarine, orange, strict grid</span></figcaption>
        </figure>
        <figure>
          <img src="03-boutique-heritage.png" alt="Draft 3, Boutique Heritage" />
          <figcaption><strong>3. Boutique Heritage</strong><span>Navy, parchment, brass</span></figcaption>
        </figure>
        <figure>
          <img src="04-shophouse-contemporary.png" alt="Draft 4, Shophouse Contemporary" />
          <figcaption><strong>4. Shophouse Contemporary</strong><span>Mint, coral, indigo</span></figcaption>
        </figure>
        <figure>
          <img src="05-dark-operations.png" alt="Draft 5, Dark Operations" />
          <figcaption><strong>5. Dark Operations</strong><span>Carbon and cool mint</span></figcaption>
        </figure>
        <figure>
          <img src="06-corporate-operations-mobbin.png" alt="Draft 6, Corporate Operations" />
          <figcaption><strong>6. Corporate Operations</strong><span>Mobbin-informed</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
