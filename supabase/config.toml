# Local and CI configuration. Production settings are applied in the Supabase
# dashboard and verified with the release checklist in SUPABASE_SETUP.md.
project_id = "invoice-studio-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 20
token_verifications = 20
web3 = 0

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 1800

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "60s"

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
