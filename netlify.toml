[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.19.0"
  NPM_VERSION = "11.17.0"

[context.production]
  command = "npm test && npm run build"

[context.deploy-preview]
  command = "npm test && npm run build"

[context.branch-deploy]
  command = "npm test && npm run build"
